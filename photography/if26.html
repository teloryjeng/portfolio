<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Dokumentasi Immersive Fiesta 2026 - Photography by Muhammad Sururi Ardan.">
    <title>Immersive Fiesta 2026 | Videography Side</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Alumni+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Antic+Didone&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/transition.css">
    <script src="../script/transition.js" defer></script>
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/project-detail-shared.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../fonts/font.css">
    <link rel="icon" type="image/png" href="../assets/logo/sdefault.png">

    <style>
        .if26-hero .hero-bg-img {
            object-position: center 60%;
            -webkit-mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
        }

        .if26-hero .hero-content-overlay .section-container {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .if26-hero .hero-titles {
            align-items: center;
            text-align: center;
        }

        .if26-hero .hero-tagline,
        .if26-hero .hero-subtitle {
            filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.8));
        }

        .if26-hero-logo {
            width: min(100%, 560px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(4px 4px 0 rgba(0, 0, 0, 0.85));
        }

        .if26-video-section .gallery-heading {
            margin-bottom: 1.5rem;
        }

        .if26-video-section .video-result-container {
            max-width: 1100px;
        }

        @media (max-width: 992px) {
            .if26-hero .hero-content-overlay {
                align-items: flex-start;
                padding-top: clamp(50px, 8vh, 90px);
            }
        }
    </style>
</head>

<body>
    <script src="../script/header.js"></script>

    <main>
        <section class="project-detail-hero if26-hero">
            <div class="hero-bg-container">
                <img src="../assets/img/photoside_optimized/if26/hero.jpg"
                    alt="Suasana acara Immersive Fiesta 2026" class="hero-bg-img">
            </div>
            <div class="hero-content-overlay">
                <div class="section-container">
                    <div class="hero-titles">
                        <span class="hero-tagline">Event Documentation</span>
                        <img src="../assets/logo/if26.png" alt="Immersive Fiesta 2026"
                            class="if26-hero-logo">
                        <span class="hero-subtitle">VIDEOPGRAPHY COLLECTION</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="project-story-section">
            <div class="section-container">
                <h2 class="story-heading">About This Collection</h2>
                <div class="story-row">
                    <div class="story-text-col" style="flex: 1.5;">
                        <p class="story-paragraph">
                            Koleksi ini mendokumentasikan rangkaian acara Immersive Fiesta 2026 melalui suasana,
                            aktivitas, dan momen kebersamaan para pesertanya.
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <section class="project-gallery-section if26-video-section">
            <div class="section-container">
                <h2 class="gallery-heading">Event Video</h2>
                <div class="video-result-container">
                    <div class="video-result-wrapper">
                        <iframe
                            src="https://drive.google.com/file/d/1uE44Uo8HgSNWYz0CRS4fVHhyaJFuPbo-/preview"
                            title="Video Immersive Fiesta 2026" allow="autoplay" allowfullscreen loading="lazy"
                            referrerpolicy="strict-origin-when-cross-origin"></iframe>
                    </div>
                </div>
            </div>
        </section>

        <section style="padding: 4rem 0; text-align: center;">
            <div class="section-container">
                <a href="../visual-stories.html" class="btn-primary" style="text-decoration: none;">
                    BACK TO GALLERY
                    <svg width="8" height="12" viewBox="0 0 8 12" fill="none" class="btn-arrow"
                        style="margin-left: 8px;" aria-hidden="true">
                        <path d="M2 2L6 6L2 10" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </a>
            </div>
        </section>
    </main>

    <script src="../script/footer.js"></script>
    <script src="../script/project-overlay.js?v=3" defer></script>
</body>

</html>
