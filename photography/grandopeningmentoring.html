<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="description"

    <title>Grand Opening Mentoring | Photography Side</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link

    <link rel="stylesheet" href="../css/style.css">

    <link rel="icon" type="image/png" href="../assets/logo/sdefault.png">
    <style>
        .hero-bg-img {
            object-position: center 52%;
            -webkit-mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 85%, transparent 100%);
        }

        .grandopeningmentoring-hero-logo {
            width: min(80vw, 760px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.7));
        }

        @media (min-width: 993px) {
            .grandopeningmentoring-hero .hero-content-overlay .section-container {
                width: 100%;
                max-width: none;
                margin: 0;
                display: flex;
                justify-content: flex-end;
                padding-right: clamp(2rem, 8vw, 8rem);
            }

            .grandopeningmentoring-hero .hero-titles {
                width: min(50vw, 760px);
                align-items: center;
                text-align: center;
            }

            .grandopeningmentoring-hero .grandopeningmentoring-hero-logo {
                width: 100%;
                max-width: none;
            }
        }

        .grandopeningmentoring-hero-subtitle {
            margin-top: 1rem;
            font-family: var(--font-heading);
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 500;
            color: var(--text-white);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .grandopening-video-frame {
            width: min(100%, 1000px);
            aspect-ratio: 16 / 9;
            margin: 0 auto;
            border: 3px solid #000;
            box-shadow: 8px 8px 0 var(--primary-color);
            overflow: hidden;
            background: #000;
        }

        .grandopening-video-section .gallery-heading {
            margin-bottom: 1rem;
        }

        .grandopening-video-frame iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <script src="../script/header.js"></script>

    <main>
        <section class="project-detail-hero grandopeningmentoring-hero">
            <div class="hero-bg-container">

                    alt="Suasana Grand Opening Mentoring" class="hero-bg-img">
            </div>
            <div class="hero-content-overlay">
                <div class="section-container">
                    <div class="hero-titles">
                        <span class="hero-tagline">Event Documentation</span>

                            Koleksi ini mendokumentasikan momen kebersamaan dalam acara Grand Opening Mentoring.
                            Galeri foto menangkap suasana acara dan interaksi para peserta.
                        </p>
                    </div>
                </div>
            </div>
        </section>
