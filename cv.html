<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Preview Curriculum Vitae Muhammad Sururi Ardan.">
    <title>Curriculum Vitae | Sururi Ardan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Alumni+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Antic+Didone&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/transition.css">
    <script src="./script/transition.js" defer></script>
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <link rel="stylesheet" href="./fonts/font.css">
    <link rel="icon" type="image/png" href="./assets/logo/sdefault.png">
    <link rel="apple-touch-icon" href="./assets/logo/sdefault.png">
    <style>
        .cv-preview-section {
            padding: clamp(7rem, 12vh, 10rem) 0 4rem;
        }

        .cv-preview-title {
            margin-bottom: 2rem;
            color: var(--text-white);
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 3.5rem);
            text-align: center;
            text-transform: uppercase;
        }

        .cv-preview-frame {
            display: block;
            width: 100%;
            max-width: 850px;
            height: auto;
            aspect-ratio: 210 / 297;
            margin: 0 auto;
            border: 3px solid #000;
            border-radius: 12px;
            background: #fff;
            box-shadow: 8px 8px 0 rgba(229, 46, 46, 0.95);
        }

        .cv-open-link-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .cv-open-prompt {
            margin: 0;
            color: var(--text-white);
            font-family: var(--font-serif);
            font-size: 1.1rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <script src="./script/header.js"></script>

    <main>
        <section class="cv-preview-section">
            <div class="section-container">
                <h1 class="cv-preview-title">Curriculum Vitae</h1>
                <iframe class="cv-preview-frame"
                    src="https://docs.google.com/document/d/1KfJ0zHl66gbJzxGr6d71RPkU2C2HnQPT0OAnOeDo7jM/preview?embedded=true"
                    title="Curriculum Vitae Muhammad Sururi Ardan" loading="lazy"></iframe>
                <div class="cv-open-link-container">
                    <p class="cv-open-prompt">Preview tidak muncul?</p>
                    <a class="btn-primary"
                        href="https://docs.google.com/document/d/1KfJ0zHl66gbJzxGr6d71RPkU2C2HnQPT0OAnOeDo7jM/edit?usp=sharing"
                        target="_blank" rel="noopener noreferrer">
                        OPEN CV IN GOOGLE DOCS
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14 3h7v7" />
                            <path d="M10 14 21 3" />
                            <path d="M21 14v6a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6" />
                        </svg>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <script src="./script/footer.js"></script>
    <script src="./script/script.js"></script>
</body>

</html>
